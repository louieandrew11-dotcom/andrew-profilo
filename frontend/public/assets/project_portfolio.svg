<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#040406"/>
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="16" fill="url(#p4Grad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="600" cy="400" r="300" fill="url(#centerLight)"/>

  <!-- Editorial Typography Preview inside Mockup -->
  <text x="100" y="240" fill="#ffffff" font-family="Cinzel, serif" font-weight="900" font-size="80" letter-spacing="4">LOUIE</text>
  <text x="100" y="340" fill="#ffffff" font-family="Cinzel, serif" font-weight="900" font-size="80" letter-spacing="4">ANDREW</text>
  
  <text x="105" y="400" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="20" letter-spacing="6">CREATIVE DEVELOPER</text>
  
  <!-- Subtitle -->
  <text x="105" y="460" fill="#94a3b8" font-family="sans-serif" font-size="16">Building interactive digital experiences with code, design &amp; animation.</text>

  <!-- Buttons -->
  <rect x="105" y="500" width="180" height="50" rx="8" fill="#ffffff"/>
  <text x="135" y="532" fill="#050507" font-family="sans-serif" font-weight="bold" font-size="13">VIEW PROJECTS</text>

  <rect x="305" y="500" width="180" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
  <text x="345" y="532" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">CONTACT ME</text>

  <!-- Right Floating 3D Avatar Mockup -->
  <circle cx="850" cy="400" r="180" fill="rgba(255,255,255,0.03)" stroke="rgba(168,85,247,0.4)" stroke-width="2"/>
  <circle cx="850" cy="400" r="140" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.4)" stroke-dasharray="8 8" stroke-width="1.5"/>
  <text x="770" y="410" fill="#ffffff" font-family="Cinzel, serif" font-weight="bold" font-size="28">LA 3D EXPERIENCE</text>
</svg>
