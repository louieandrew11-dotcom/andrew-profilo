<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#08080c"/>
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>
    <linearGradient id="neonBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="url(#p1Grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect x="40" y="40" width="1120" height="50" fill="#101018" rx="16"/>
  <circle cx="75" cy="65" r="7" fill="#ff5f56"/>
  <circle cx="95" cy="65" r="7" fill="#ffbd2e"/>
  <circle cx="115" cy="65" r="7" fill="#27c93f"/>
  <rect x="350" y="52" width="500" height="26" rx="6" fill="#181824" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="500" y="70" fill="#94a3b8" font-family="sans-serif" font-size="12">https://ai-electronics-store.dev</text>

  <!-- Navigation Bar -->
  <rect x="70" y="110" width="1060" height="60" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="100" y="146" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="20">NEO-GEAR.AI</text>
  <rect x="850" y="125" width="120" height="32" rx="8" fill="url(#neonBtn)"/>
  <text x="880" y="146" fill="#050507" font-family="sans-serif" font-weight="bold" font-size="12">Cart (3)</text>

  <!-- Hero Banner inside Mockup -->
  <rect x="70" y="190" width="1060" height="220" rx="16" fill="rgba(56, 189, 248, 0.05)" stroke="rgba(56, 189, 248, 0.2)"/>
  <text x="110" y="250" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="32">AI-POWERED ELECTRONICS STORE</text>
  <text x="110" y="285" fill="#94a3b8" font-family="sans-serif" font-size="16">Smart recommendation engine, real-time inventory &amp; dynamic checkout.</text>
  <rect x="110" y="320" width="160" height="42" rx="8" fill="url(#neonBtn)"/>
  <text x="142" y="346" fill="#050507" font-family="sans-serif" font-weight="bold" font-size="14">Shop Gear</text>

  <!-- Product Cards Grid -->
  <g transform="translate(70, 440)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="240" height="280" rx="12" fill="#12121c" stroke="rgba(255,255,255,0.08)"/>
    <rect x="15" y="15" width="210" height="140" rx="8" fill="#1a1a28"/>
    <text x="15" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">Neural Headphones X</text>
    <text x="15" y="205" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">$349.00</text>
    <rect x="15" y="225" width="210" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="80" y="248" fill="#ffffff" font-family="sans-serif" font-size="12">Add to Cart</text>

    <!-- Product 2 -->
    <rect x="270" y="0" width="240" height="280" rx="12" fill="#12121c" stroke="rgba(255,255,255,0.08)"/>
    <rect x="285" y="15" width="210" height="140" rx="8" fill="#1a1a28"/>
    <text x="285" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">Quantum Watch Pro</text>
    <text x="285" y="205" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">$499.00</text>
    <rect x="285" y="225" width="210" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="350" y="248" fill="#ffffff" font-family="sans-serif" font-size="12">Add to Cart</text>

    <!-- Product 3 -->
    <rect x="540" y="0" width="240" height="280" rx="12" fill="#12121c" stroke="rgba(255,255,255,0.08)"/>
    <rect x="555" y="15" width="210" height="140" rx="8" fill="#1a1a28"/>
    <text x="555" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">Cyber Keyboard 75%</text>
    <text x="555" y="205" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">$189.00</text>
    <rect x="555" y="225" width="210" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="620" y="248" fill="#ffffff" font-family="sans-serif" font-size="12">Add to Cart</text>

    <!-- Product 4 -->
    <rect x="810" y="0" width="250" height="280" rx="12" fill="#12121c" stroke="rgba(255,255,255,0.08)"/>
    <rect x="825" y="15" width="220" height="140" rx="8" fill="#1a1a28"/>
    <text x="825" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">AI Smart Lens G1</text>
    <text x="825" y="205" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="16">$799.00</text>
    <rect x="825" y="225" width="220" height="36" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="890" y="248" fill="#ffffff" font-family="sans-serif" font-size="12">Add to Cart</text>
  </g>
</svg>
