<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#050508"/>
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140e24"/>
      <stop offset="100%" stop-color="#080510"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="1120" height="720" rx="16" fill="url(#p2Grad)" stroke="rgba(168,85,247,0.25)" stroke-width="2"/>
  
  <rect x="40" y="40" width="1120" height="50" fill="#0d0818" rx="16"/>
  <circle cx="75" cy="65" r="7" fill="#ff5f56"/>
  <circle cx="95" cy="65" r="7" fill="#ffbd2e"/>
  <circle cx="115" cy="65" r="7" fill="#27c93f"/>
  <text x="500" y="70" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="13">SkillForge Platform — Interactive Learning Studio</text>

  <!-- Sidebar -->
  <rect x="70" y="110" width="240" height="620" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <text x="95" y="150" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="22">SKILLFORGE</text>
  <rect x="90" y="180" width="200" height="40" rx="8" fill="url(#purpleGlow)"/>
  <text x="120" y="205" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">⚡ Python Mastery</text>
  
  <text x="95" y="260" fill="#94a3b8" font-family="sans-serif" font-size="13">📘 Web Development</text>
  <text x="95" y="300" fill="#94a3b8" font-family="sans-serif" font-size="13">🤖 Machine Learning</text>
  <text x="95" y="340" fill="#94a3b8" font-family="sans-serif" font-size="13">🎨 UI/UX Design</text>

  <!-- Main Code IDE Panel -->
  <rect x="330" y="110" width="800" height="620" rx="12" fill="#0a0812" stroke="rgba(255,255,255,0.08)"/>
  <rect x="330" y="110" width="800" height="40" fill="#120d20" rx="12"/>
  <text x="350" y="135" fill="#e2e8f0" font-family="monospace" font-size="13">main.py — SkillForge Code Sandbox</text>

  <g transform="translate(360, 180)" font-family="monospace" font-size="14">
    <text x="0" y="0" fill="#a855f7">class <tspan fill="#38bdf8">SkillForgeEngine</tspan>:</text>
    <text x="20" y="28" fill="#e2e8f0">def __init__(self, student_name):</text>
    <text x="40" y="56" fill="#94a3b8">self.student = student_name</text>
    <text x="40" y="84" fill="#94a3b8">self.skills = ["Python", "Flask", "React", "GSAP"]</text>
    <text x="20" y="140" fill="#a855f7">def <tspan fill="#38bdf8">build_interactive_project</tspan>(self):</text>
    <text x="40" y="168" fill="#e2e8f0">return f"🚀 {self.student} built a high-performance web app!"</text>
    
    <text x="0" y="240" fill="#22c55e"># Initialize Student Module</text>
    <text x="0" y="268" fill="#e2e8f0">app = SkillForgeEngine("<tspan fill="#f59e0b">Louie Andrew S</tspan>")</text>
    <text x="0" y="296" fill="#e2e8f0">print(app.build_interactive_project())</text>
  </g>

  <!-- Terminal Output -->
  <rect x="350" y="530" width="760" height="180" rx="8" fill="#05030a" stroke="rgba(34, 197, 94, 0.3)"/>
  <text x="370" y="560" fill="#22c55e" font-family="monospace" font-size="13">$ python main.py</text>
  <text x="370" y="590" fill="#ffffff" font-family="monospace" font-size="14">🚀 Louie Andrew S built a high-performance web app!</text>
  <text x="370" y="620" fill="#94a3b8" font-family="monospace" font-size="12">[Process completed with exit code 0]</text>
</svg>
